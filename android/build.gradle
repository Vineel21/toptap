allprojects {
    repositories {
        google()
        mavenCentral()
        // Add Arthenica repository for FFmpeg Kit
        maven { url "https://github.com/ArthenicaPackages/ArthenicaMavenRepository/raw/master/releases" }
        // DeepAR SDK local AAR (used by deepar_flutter_plus)
        flatDir {
            dirs "${rootDir}/app/libs", "${rootDir}/../third_party/deepar_flutter_plus/android/libs"
        }
    }
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    namespace project.group
                }
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(":app")
}


tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
